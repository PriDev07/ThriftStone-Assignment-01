version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override QDRANT_PATH to persist the index inside the container volume
      QDRANT_PATH: /app/qdrant_data
    volumes:
      - qdrant_data:/app/qdrant_data
    restart: unless-stopped

  frontend:
    build: .
    command: streamlit run frontend/app_ui.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
